services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override to pin a tag/SHA: MEF2STREAMER_REF=<sha> docker-compose build
        MEF2STREAMER_REF: ${MEF2STREAMER_REF:-main}
    env_file:
      - dev.env
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
